<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- KitsuneMCP fox mark, v3 — sharper / more fox-like per feedback on v2
       ("too round, reads as a shield/heart at small size").
       Motif borrowed (atmosphere only, not traced): a fox face split down
       the middle into two flat colors. Silhouette, ear/eye shapes and all
       coordinates are original and built from scratch — no reference-image
       geometry was copied. No frame, no lettering.

       v3 changes from v2:
       - Straight-line polygon instead of curves: tall flared ears, wide
         cheeks, a sharp tapering chin (the actual "fox" cues that v2's
         rounded outline lost).
       - Added slanted eye wedges and inner ear notches for a face.
       - Kept v2's palette: red/yellow halves + one dark unifying outline. -->

  <defs>
    <!-- Sharp hexagon: two tall outward-flared ears meeting at a center
         notch, wide cheeks, tapering to a single chin point. -->
    <path
      id="fox-face"
      d="M 4 2
         L 16 11
         L 28 2
         L 30 15
         L 16 30
         L 2 15
         Z"
    />
    <clipPath id="fox-left-half">
      <rect x="0" y="0" width="16" height="32" />
    </clipPath>
    <clipPath id="fox-right-half">
      <rect x="16" y="0" width="16" height="32" />
    </clipPath>
  </defs>

  <!-- Left half: solid red -->
  <use href="#fox-face" fill="#D9372B" clip-path="url(#fox-left-half)" />

  <!-- Right half: solid yellow -->
  <use href="#fox-face" fill="#F5C518" clip-path="url(#fox-right-half)" />

  <!-- Unifying outline. stroke-miterlimit keeps the acute ear/chin angles
       from spiking out past the viewBox as needle-thin points. -->
  <use
    href="#fox-face"
    fill="none"
    stroke="#3A0E08"
    stroke-width="1.7"
    stroke-linejoin="miter"
    stroke-miterlimit="3"
  />

  <!-- Inner ear notches — a hint of "hollow ear", not a traced cutout. -->
  <path d="M 7 6 L 13 9 L 9 11 Z" fill="#3A0E08" />
  <path d="M 25 6 L 19 9 L 23 11 Z" fill="#3A0E08" />

  <!-- Slanted eyes -->
  <path d="M 9 18 L 13 17 L 12 20 Z" fill="#3A0E08" />
  <path d="M 23 18 L 19 17 L 20 20 Z" fill="#3A0E08" />
</svg>
